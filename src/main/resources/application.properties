spring.application.name=Cookie

# ── PostgreSQL ──
spring.datasource.url=jdbc:postgresql://localhost:5432/cookiedb
spring.datasource.username=postgres
spring.datasource.password=dbonilla03
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Spring Session (JDBC – cookie de sesión) ──
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.name=COOKIE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# ── Thymeleaf ──
spring.thymeleaf.cache=false

# ── Server ──
server.port=8080
