<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie · Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-page">

    <!-- Fondo -->
    <div class="bg-gradient"></div>
    <div class="bg-grain"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon-sm">🍪</span>
            <span class="nav-title">Cookie</span>
        </div>
        <div class="nav-actions">
            <span class="nav-user" th:text="${user.fullName}">Usuario</span>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="btn btn-ghost">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="dashboard-content">
        <!-- Saludo -->
        <div class="welcome-section">
            <h1>Hola, <span th:text="${user.fullName}">Usuario</span> 👋</h1>
            <p>Tu sesión está activa y protegida con una cookie segura</p>
        </div>

        <!-- Cards de información -->
        <div class="info-grid">
            <!-- Card: Datos del usuario -->
            <div class="info-card">
                <div class="card-header">
                    <div class="card-icon card-icon-blue">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <h3>Perfil</h3>
                </div>
                <div class="card-body">
                    <div class="data-row">
                        <span class="data-label">Nombre</span>
                        <span class="data-value" th:text="${user.fullName}">—</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Usuario</span>
                        <span class="data-value" th:text="${user.username}">—</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Rol</span>
                        <span class="badge" th:text="${user.role}" th:classappend="${user.role == 'ADMIN'} ? ' badge-purple' : ' badge-green'">—</span>
                    </div>
                </div>
            </div>

            <!-- Card: Cookie de sesión -->
            <div class="info-card">
                <div class="card-header">
                    <div class="card-icon card-icon-amber">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/>
                            <path d="M8.5 8.5v.01"/>
                            <path d="M16 15.5v.01"/>
                            <path d="M12 12v.01"/>
                            <path d="M11 17v.01"/>
                            <path d="M7 14v.01"/>
                        </svg>
                    </div>
                    <h3>Cookie de Sesión</h3>
                </div>
                <div class="card-body">
                    <div class="data-row">
                        <span class="data-label">Nombre</span>
                        <code class="data-code" th:text="${cookieName}">—</code>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Session ID</span>
                        <code class="data-code data-code-sm" th:text="${sessionId}">—</code>
                    </div>
                    <div class="data-row">
                        <span class="data-label">HttpOnly</span>
                        <span class="badge badge-green">Sí</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Store</span>
                        <span class="badge badge-blue">JDBC</span>
                    </div>
                </div>
            </div>

            <!-- Card: Datos de sesión -->
            <div class="info-card info-card-wide">
                <div class="card-header">
                    <div class="card-icon card-icon-green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <h3>Datos Capturados en Sesión</h3>
                </div>
                <div class="card-body">
                    <div class="session-data-grid">
                        <div class="session-item">
                            <span class="session-key">username</span>
                            <span class="session-val" th:text="${user.username}">—</span>
                        </div>
                        <div class="session-item">
                            <span class="session-key">fullName</span>
                            <span class="session-val" th:text="${user.fullName}">—</span>
                        </div>
                        <div class="session-item">
                            <span class="session-key">role</span>
                            <span class="session-val" th:text="${user.role}">—</span>
                        </div>
                        <div class="session-item">
                            <span class="session-key">loginTime</span>
                            <span class="session-val" th:text="${loginTime}">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
